<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #05060f;
      overflow: hidden;
      /* The game is one big tap target — never let the browser hijack a tap. */
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #unity-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* Lock to 9:16 and letterbox. Sized explicitly rather than via aspect-ratio so
       it also behaves on screens taller than 9:16. */
    #unity-canvas {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: block;
      background: #05060f;
      outline: none;
    }

    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      background: #05060f;
      color: #d9e2ff;
      transition: opacity .4s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }

    #loader h1 {
      font-size: clamp(28px, 7vw, 54px);
      font-weight: 800; letter-spacing: .12em;
    }
    #loader h1 span { color: #ff73f0; }

    #bar {
      width: min(62vw, 320px); height: 6px;
      background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden;
    }
    #fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #6ef2ff, #ff73f0);
      transition: width .2s ease;
    }
    #note { font-size: 13px; letter-spacing: .16em; color: #6a76a0; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loader">
    <h1>NEON <span>ZIGZAG</span></h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="note">LOADING</div>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loader = document.querySelector("#loader");
    var fill = document.querySelector("#fill");
    var note = document.querySelector("#note");

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    }, function (progress) {
      fill.style.width = (progress * 100) + "%";
    }).then(function () {
      loader.classList.add("done");
      canvas.focus();
    }).catch(function (message) {
      note.textContent = "FAILED TO LOAD";
      console.error(message);
    });

    // Keyboard input should reach the game, not scroll the page.
    window.addEventListener("keydown", function (e) {
      if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) !== -1) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
